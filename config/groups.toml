# Multicast groups used by the lab. Group membership is an IP-layer concept
# (IGMP); the UDP port only selects the receiving socket. All groups use the
# same port here, so the port does NOT separate them -- the group IP does.

[groups.position]
ip = "239.1.1.1"
port = 5000
purpose = "GNSS position data"

[groups.heading]
ip = "239.1.1.2"
port = 5000
purpose = "Heading and gyro data"

[groups.speed]
ip = "239.1.1.3"
port = 5000
purpose = "Speed log data"

[groups.combined]
ip = "239.1.1.4"
port = 5000
purpose = "Combined navigation stream"

[groups.instrumentation]
ip = "239.1.1.5"
port = 5000
purpose = "Diagnostic and instrument data"
